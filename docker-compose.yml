services:
  discord-bot:
    build: .
    container_name: discord-mcp-bot
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    # The image defaults to the MCP server (stdio). To run the
    # standalone bot (slash commands) 24/7 instead, uncomment:
    # command: npm run bot
