services:
  discord-bot:
    build: .
    container_name: discord-mcp-bot
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
    # By default, docker-compose runs the standalone bot.
    # To run the MCP server instead, uncomment the line below:
    # command: npm run mcp
